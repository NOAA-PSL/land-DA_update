cost function:
  cost type: 3D-Var
  jb evaluation: false
  time window:
    begin: 'XXYYYB-XXMB-XXDBTXXHB:00:00Z'
    length: PTXXWINLENH
    bound to include: end
  geometry:
    fms initialization:
      namelist filename: Data/fv3files/fmsmpp.nml
      field table filename: Data/fv3files/field_table_gfdl
    akbk: Data/fv3files/akbk127.nc4
    #layout:
    #- 5
    #- 5
    layout: [XXLX,XXLY]
    npx: XXREP
    npy: XXREP
    npz: 127
  analysis variables:
  - totalSnowDepth
  background:
    datapath: ./restarts/
    filetype: fms restart
    skip coupler file: true
    datetime: 'XXYYYY-XXMM-XXDDTXXHH:00:00Z'
    state variables:
    - totalSnowDepth
    - vtype
    - slmsk
    - sheleg
    - filtered_orography
    #- fraction_of_ice
    - fraction_of_land
    field io names:
      totalSnowDepth: snodl
      filtered_orography: orog_filt
      #fraction_of_ice: fice
      fraction_of_land: land_frac
    filename_sfcd: XXYYYYXXMMXXDD.XXHH0000.sfc_data.nc
    filename_cplr: XXYYYYXXMMXXDD.XXHH0000.coupler.res
    filename_orog: CXXRES.XXORES_oro_data.nc
  background error:
    covariance model: SABER
    saber central block:
      saber block name: BUMP_NICAS
      read:
        general:
          universe length-scale: 300000.0
        drivers:
          multivariate strategy: univariate
          read global nicas: true
        nicas:
          explicit length-scales: true
          horizontal length-scale:
          - groups:
            - totalSnowDepth_shadowLevels
            value: 250000.0
          vertical length-scale:
          - groups:
            - totalSnowDepth_shadowLevels
            value: 0.0
          interpolation type:
          - groups:
            - totalSnowDepth_shadowLevels
            type: c0
          same horizontal convolution: true
        io:
          data directory: /scratch4/NCEPDEV/land/data/DA/bump_snow/
          files prefix: snow_bump_nicas_250km_shadowlevels
    saber outer blocks:
    - saber block name: ShadowLevels
      fields metadata:
        totalSnowDepth:
          vert_coord: filtered_orography
      calibration:
        number of shadow levels: 50
        lowest shadow level: -450.0
        highest shadow level: 8850.0
        vertical length-scale: 2000.0
    - saber block name: BUMP_StdDev
      read:
        drivers:
          compute variance: true
        variance:
          explicit stddev: true
          stddev:
          - variables:
            - totalSnowDepth
            value: 30.0
  observations:
    obs perturbations: false
    observers:
    - obs space:
        name: ghcn_snow
        obsdatain:
          engine:
            type: H5File
            obsfile: GHCN_XXYYYYXXMMXXDDXXHH.nc
            missing file action: warn
        obsdataout:
          engine:
            type: H5File
            obsfile: output/DA/hofx/var_hofx_ghcn_XXYYYYXXMMXXDDXXHH.nc
        simulated variables:
        - totalSnowDepth
      obs operator:
        name: Identity
      obs pre filters:
      - filter: Create Diagnostic Flags
        flags:
        - name: missing_snowdepth
          initial value: false
        - name: missing_elevation
          initial value: false
        - name: invalid_snowdepth
          initial value: false
        - name: invalid_elevation
          initial value: false
        - name: land_check
          initial value: false
        - name: landice_check
          initial value: false
        - name: seaice_check
          initial value: false
        - name: elevation_bkgdiff
          initial value: false
        - name: rejectlist
          initial value: false
        - name: background_check
          initial value: false
      - filter: Perform Action
        filter variables:
        - name: totalSnowDepth
        action:
          name: assign error
          error parameter: 40.0
      - filter: Domain Check
        where:
        - variable:
            name: ObsValue/totalSnowDepth
          value: is_valid
        actions:
        - name: set
          flag: missing_snowdepth
          ignore: rejected observations
        - name: reject
      - filter: Domain Check
        where:
        - variable:
            name: MetaData/stationElevation
          value: is_valid
        actions:
        - name: set
          flag: missing_elevation
          ignore: rejected observations
        - name: reject
      obs prior filters:
      - filter: Bounds Check
        filter variables:
        - name: totalSnowDepth
        minvalue: 0.0
        maxvalue: 20000.0
        actions:
        - name: set
          flag: invalid_snowdepth
          ignore: rejected observations
        - name: reject
      - filter: Domain Check
        where:
        - variable:
            name: GeoVaLs/fraction_of_land
          minvalue: 0.5
        actions:
        - name: set
          flag: land_check
          ignore: rejected observations
        - name: reject
      - filter: Domain Check
        where:
        - variable:
            name: MetaData/stationElevation
          minvalue: -200.0
          maxvalue: 9900.0
        actions:
        - name: set
          flag: invalid_elevation
          ignore: rejected observations
        - name: reject
      #- filter: Domain Check
      #  where:
      #  - variable:
      #      name: GeoVaLs/fraction_of_ice
      #    maxvalue: 0.0
      #  actions:
      #  - name: set
      #    flag: seaice_check
      #    ignore: rejected observations
      #  - name: reject
      - filter: RejectList
        where:
        - variable:
            name: GeoVaLs/vtype
          minvalue: 14.5
          maxvalue: 15.5
        actions:
        - name: set
          flag: landice_check
          ignore: rejected observations
        - name: reject
      - filter: Difference Check
        reference: MetaData/stationElevation
        value: GeoVaLs/filtered_orography
        threshold: 800.0
        actions:
        - name: set
          flag: elevation_bkgdiff
          ignore: rejected observations
        - name: reject
      - filter: Variable Assignment
        assignments:
        - name: DerivedMetaData/elevation_diff
          type: float
          function:
            name: ObsFunction/Arithmetic
            options:
              variables:
              - MetaData/stationElevation
              - GeoVaLs/filtered_orography
              coefficients:
              - 1.0
              - -1.0
              total exponent: 2
              total coefficient: 1.5625e-06
      - filter: Variable Assignment
        assignments:
        - name: DerivedMetaData/elevation_diff_exp
          type: float
          function:
            name: ObsFunction/Exponential
            options:
              variables:
              - DerivedMetaData/elevation_diff
              coeffA: 1.0
              coeffB: -1.0
              coeffC: 0.0
              coeffD: 1.0
      - filter: Variable Assignment
        assignments:
        - name: DerivedMetaData/elevation_diff_exp_inv
          type: float
          function:
            name: ObsFunction/Arithmetic
            options:
              variables:
              - DerivedMetaData/elevation_diff_exp
              total exponent: -1.0
      - filter: Perform Action
        filter variables:
        - name: totalSnowDepth
        where:
        - variable:
            name: ObsValue/totalSnowDepth
          minvalue: 0.0
        action:
          name: inflate error
          inflation variable: DerivedMetaData/elevation_diff_exp_inv
      - filter: BlackList
        where:
        - variable:
            name: MetaData/stationIdentification
          is_in:
          - fakelist
        actions:
        - name: set
          flag: rejectlist
          ignore: rejected observations
        - name: reject
      obs post filters:
      - filter: Background Check
        filter variables:
        - name: totalSnowDepth
        absolute threshold: 250
        bias correction parameter: 1.0
        actions:
        - name: set
          flag: background_check
          ignore: rejected observations
        - name: reject
variational:
  minimizer:
    algorithm: DRPCG
  iterations:
  - ninner: 50
    gradient norm reduction: 1e-10
    test: true
    geometry:
      fms initialization:
        namelist filename: Data/fv3files/fmsmpp.nml
        field table filename: Data/fv3files/field_table_gfdl
      akbk: Data/fv3files/akbk127.nc4
      #layout:
      #- 5
      #- 5
      layout: [XXLX,XXLY]
      npx: XXREP
      npy: XXREP
      npz: 127
      time invariant fields:
        state fields:
          datetime: 'XXYYYY-XXMM-XXDDTXXHH:00:00Z'
          filetype: fms restart
          skip coupler file: true
          state variables:
          - filtered_orography
          - fraction_of_land
          field io names:
            filtered_orography: orog_filt
            fraction_of_land: land_frac
          #datapath: 
          filename_orog: CXXRES.XXORES_oro_data.nc
    diagnostics:
      departures: bkgmob
final:
  diagnostics:
    departures: anlmob
  prints:
    frequency: PT3H
  increment:
    output:
      state component:
        datapath: ./
        prefix: snowinc
        filetype: fms restart
        filename_sfcd: XXYYYYXXMMXXDD.XXHH0000.sfc_data.nc
        filename_cplr: XXYYYYXXMMXXDD.XXHH0000.coupler.res
        state variables:
        - totalSnowDepth
        - vtype
        - slmsk
        field io names:
          totalSnowDepth: snodl
    geometry:
      fms initialization:
        namelist filename: Data/fv3files/fmsmpp.nml
        field table filename: Data/fv3files/field_table_gfdl
      akbk: Data/fv3files/akbk127.nc4
      #layout:
      #- 5
      #- 5
      layout: [XXLX,XXLY]
      npx: XXREP
      npy: XXREP
      npz: 127
final j evaluation: false
