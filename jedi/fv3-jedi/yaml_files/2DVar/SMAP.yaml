    - obs space:
        name: SoilMoistureSMAP
        distribution: 
          name: Halo
          halo size: 250e3
        simulated variables: [soilMoistureVolumetric]
        obsdatain:
          engine:
            type: H5File
            obsfile: SMAP_XXYYYYXXMMXXDDXXHH.nc
            #missing file action: warn
        obsdataout:
          engine:
            type: H5File
            obsfile: output/DA/hofx/var_hofx_smap_XXYYYYXXMMXXDDTXXHH00.nc
      obs operator:
        name: Identity
      obs error:
        covariance model: diagonal
      obs localizations:
      - localization method: Horizontal Gaspari-Cohn
        lengthscale: 250e3
        max nobs: 50
#      - localization method: Horizontal SOAR
#        lengthscale: 250e3
#        soar horizontal decay: 0.000021
#      obs filters:
      obs pre filters:
      - filter: Perform Action
        filter variables:
        - name: soilMoistureVolumetric
        action:
          name: assign error
          error parameter: 0.2
      obs prior filters:
      - filter: Domain Check
        where:
        - variable: # land only
            name: GeoVaLs/slmsk
          minvalue: 0.5
          maxvalue: 1.5
      - filter: Domain Check
        where:
        - variable: # no snow
            name: GeoVaLs/sheleg
          maxvalue: 0.0
      - filter: Domain Check
        where:
        - variable: # high-quality retrievals
            name: PreQC/soilMoistureVolumetric
          is_in: 0, 8
      - filter: BlackList 
        where:
        - variable: # exclude certain IGBP vegetation types
            name: GeoVaLs/vtype
          absolute_tolerance: 1.0e-3
          is_close_to_any_of: [1, 2, 3, 4, 13, 15, 17]
      obs post filters:
      - filter: Background Check # gross error check
        filter variables:
        - name: soilMoistureVolumetric
        #threshold: 5
        absolute threshold: 0.5
        bias correction parameter: 1.0
        action:
          name: reject
