    - obs space:
        name: SnowDepthGHCN
        distribution:
          name: Halo #InefficientDistribution  #Halo
          halo size: 250e3
        simulated variables: [totalSnowDepth]
        obsdatain:
          engine:
            type: H5File
            obsfile: GHCN_XXYYYYXXMMXXDDXXHH.nc
        obsdataout:
          engine:
            type: H5File
            obsfile: output/DA/hofx/hybvar_hofx_ghcn_XXYYYYXXMMXXDDXXHH.nc
      obs operator:
        name: Identity
      obs error:
        covariance model: diagonal
      obs localizations:
      - localization method: Horizontal Box car
        lengthscale: 250e3
        max nobs: 50
      obs filters:
      - filter: Bounds Check # negative / missing snow or too large snow depth
        filter variables:
        - name: totalSnowDepth
        minvalue: 0.0
        maxvalue: 100000
      - filter: Domain Check # missing station elevation (-999.9)
        where:
        - variable:
            name: MetaData/stationElevation
          minvalue: -999.0
      - filter: Domain Check # land only
        where:
        - variable:
            name: GeoVaLs/slmsk
          minvalue: 0.5
          maxvalue: 1.5
      - filter: RejectList  # no land-ice
        where:
        - variable:
            name: GeoVaLs/vtype
          minvalue: 14.5
          maxvalue: 15.5
      - filter: RejectList  # no water
        where:
        - variable:
            name: GeoVaLs/vtype
          minvalue: 16.5
          maxvalue: 17.5
      - filter: RejectList  # no sea ice
        where:
        - variable:
            name: GeoVaLs/vtype
          minvalue: 19.5
          maxvalue: 20.5
      - filter: Background Check # gross error check
        filter variables:
        - name: totalSnowDepth
        #threshold: 6.25
        absolute threshold: 250
        bias correction parameter: 1.0
        action:
          name: reject
      - filter: Difference Check # elevation check
        reference: MetaData/stationElevation
        value: GeoVaLs/filtered_orography
        absolute threshold: 1500.

