output:
  filetype: fms restart
  #filename: sfc_anal.nc
  datapath: ./
  prefix: sfc_anal

final:
  diagnostics:
    departures: oman

variational:
  minimizer:
    algorithm: RPCG
  iterations:
  - ninner: 50
    gradient norm reduction: 1e-10
    geometry:                           # minimization at lower resolution
      akbk: Data/fv3files/akbkXXNPZ.nc4
      npx: XXREP
      npy: XXREP
      npz: XXNPZ
      ntiles: XXNTIL
      layout: [XXLX,XXLY] #[4,4]
      io_layout: [XXIOLX,XXIOLY] #[1,1]
      #field metadata override: Data/fieldmetadata/gfs-land.yaml  #snow.yaml #gfs_v17-land.yaml
      time invariant fields:
        state fields:
          datetime: XXYYYB-XXMB-XXDBTXXHB:00:00Z
          filetype: fms restart
          skip coupler file: true
          state variables:
          - orog_filt
          datapath: XXTPATH
          filename_orog: XXTSTUB.nc
      _resol_name: cXXRES
    online diagnostics:
      write increment: true
      increment:
        state component:
          filetype: fms restart
          datapath: ./
          prefix: snowinc.XXYYYYXXMMXXDD.XXHH0000

cost function:
  cost type: 3D-Var
  time window:
    begin: XXYYYB-XXMB-XXDBTXXHB:00:00Z
    length: PTXXWINLENH
    bound to include: begin
  analysis variables: [totalSnowDepth] 
  geometry:
    npx: XXREP
    npy: XXREP
    npz: XXNPZ
    ntiles: XXNTIL
    layout: [XXLX,XXLY] #[4,4]
    io_layout: [XXIOLX,XXIOLY] #[1,1]
    _resol_name: cXXRES
    akbk: Data/fv3files/akbkXXNPZ.nc4
    fms initialization:
      namelist filename: Data/fv3files/fmsmpp.nml
      field table filename: Data/fv3files/field_table
    field metadata override: Data/fieldmetadata/gfs-land.yaml
  analysis variables:
  - totalSnowDepth

  background:
    filetype: fms restart
    skip coupler file: true
    datetime: XXYYYY-XXMM-XXDDTXXHH:00:00Z
    datapath: ./restarts/
    filename_sfcd: XXYYYYXXMMXXDD.XXHH0000.sfc_data.nc
    filename_cplr: XXYYYYXXMMXXDD.XXHH0000.coupler.res
    filename_orog: XXTSTUB.nc
    state variables: [totalSnowDepth,vtype,slmsk,sheleg,orog_filt]
  background error:
    covariance model: hybrid
    components:
    - covariance:   # static covariance
        covariance model: SABER
        saber central block:
          saber block name: BUMP_NICAS
          read:
            general:
              universe length-scale: 250000.0
            drivers:
              multivariate strategy: univariate
              read global nicas: true
            nicas:
              explicit length-scales: true
              horizontal length-scale:
              - groups:
                - totalSnowDepth_shadowLevels
                value: 250000.0
              vertical length-scale:
              - groups:
                - totalSnowDepth_shadowLevels
                value: 0.0
              interpolation type:
              - groups:
                - totalSnowDepth_shadowLevels
                type: c0
              same horizontal convolution: true
            io:
              data directory: /scratch2/NCEPDEV/land/data/DA/bump_snow/
              files prefix: snow_bump_nicas_250km_shadowlevels
        saber outer blocks:
        - saber block name: ShadowLevels
          fields metadata:
            totalSnowDepth:
              vert_coord: filtered_orography
          calibration:
            number of shadow levels: 50
            lowest shadow level: -450.0
            highest shadow level: 8850.0
            vertical length-scale: 2000.0
        - saber block name: BUMP_StdDev
          read:
            drivers:
              compute variance: true
            variance:
              explicit stddev: true
              stddev:
              - variables:
                - totalSnowDepth
                value: 30.0
      weight:
        value: 0.50
    - covariance:  # ensemble covariance
        covariance model: ensemble
        members from template:
          template:
            datetime: XXYYYY-XXMM-XXDDTXXHH:00:00Z
            filetype: fms restart
            skip coupler file: true
            state variables: [totalSnowDepth,vtype,slmsk,sheleg,orog_filt]   # sheleg,stype,vfrac,stc,smc,snwdph
            datapath: mem%mem%/
            filename_sfcd: XXYYYYXXMMXXDD.XXHH0000.sfc_data.nc
            filename_cplr: XXYYYYXXMMXXDD.XXHH0000.coupler.res
            filename_orog: XXTSTUB.nc
          pattern: '%mem%'
          nmembers: XXESZ
          zero padding: 3
        localization:
          localization method: SABER
          saber central block:
            saber block name: BUMP_NICAS  #saber block name: ID --simplest
            # active variables: *bvars
            read:
              general:
                universe length-scale: 500000.0
              drivers:
                multivariate strategy: univariate   # duplicated  
                # read local nicas: true
                compute nicas: true
                write global nicas: true
              # model:
              #   level for 2d variables: last
              io:
                data directory: output/DA/                                                  
                files prefix: snow_ens_bumpparameters_nicas_300km_XXYYYYXXMMXXDD_XXHH  
              nicas:
                resolution: 6
                max horizontal grid size: 500000
                explicit length-scales: true
                horizontal length-scale:
                - groups: [totalSnowDepth]  # Note: no _fakeLevels suffix if not using fake levels block
                  value: 500000.0            # 300 km
                # vertical length-scale:
                # - groups:
                #   - totalSnowDepth_fakeLevels
                #   value: 0.0
                # interpolation type:
                # - groups:
                #   - totalSnowDepth_fakeLevels
                #   type: c0
                # same horizontal convolution: true
      weight:
        value: 0.5    # weight of ensemble covariance
  observations:
    obs perturbations: false
    observers:
